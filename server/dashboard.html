<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyLamp AI - Dashboard</title>
<style>
  :root { --primary: #6366f1; --primary-light: #818cf8; --bg: #0f172a; --card: #1e293b; --card2: #334155; --text: #e2e8f0; --muted: #94a3b8; --green: #34d399; --yellow: #fbbf24; --red: #f87171; --blue: #60a5fa; --border: #475569; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 24px; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 1.8em; background: linear-gradient(135deg, var(--primary-light), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.9em; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
  .card h3 { font-size: 0.85em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .stat-value { font-size: 2.2em; font-weight: 700; }
  .stat-label { font-size: 0.85em; color: var(--muted); margin-top: 4px; }
  .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }
  .status-studying { background: var(--green); }
  .status-warning { background: var(--yellow); }
  .status-distracted { background: var(--red); }
  .status-absent { background: var(--muted); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .realtime-box { display: flex; align-items: center; font-size: 1.3em; padding: 16px 0; }
  .chart-container { position: relative; height: 200px; margin-top: 12px; }
  .bar-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 160px; padding-top: 20px; }
  .bar-group { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .bar { width: 32px; border-radius: 4px 4px 0 0; transition: height 0.3s; min-height: 2px; }
  .bar-label { font-size: 0.7em; color: var(--muted); margin-top: 8px; }
  .bar-value { font-size: 0.7em; color: var(--text); margin-bottom: 4px; }
  .homework-list { list-style: none; }
  .homework-item { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .homework-item:last-child { border-bottom: none; }
  .homework-subject { font-weight: 600; }
  .homework-time { font-size: 0.8em; color: var(--muted); }
  .homework-score { font-size: 0.9em; padding: 2px 10px; border-radius: 12px; background: rgba(52,211,153,0.15); color: var(--green); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; background: var(--card2); margin: 4px; font-size: 0.85em; }
  .badge-icon { font-size: 1.2em; }
  .points-total { font-size: 3em; font-weight: 700; color: var(--primary-light); }
  .streak-fire { font-size: 1.5em; }
  .ai-summary { background: var(--card2); border-radius: 8px; padding: 16px; margin-top: 12px; font-size: 0.9em; line-height: 1.8; border-left: 3px solid var(--primary); }
  .section-title { font-size: 1.1em; color: var(--primary-light); margin: 24px 0 12px; }
  .error-text { color: var(--red); font-size: 0.85em; }
  .loading { color: var(--muted); font-style: italic; }
  .ws-status { font-size: 0.75em; padding: 2px 8px; border-radius: 8px; margin-left: 8px; }
  .ws-connected { background: rgba(52,211,153,0.2); color: var(--green); }
  .ws-disconnected { background: rgba(248,113,113,0.2); color: var(--red); }
  .device-selector { background: var(--card2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 0.85em; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>StudyLamp AI</h1>
  <p class="subtitle">
    <span id="device-label">mac-dev-001</span>
    <span id="ws-status" class="ws-status ws-disconnected">disconnected</span>
  </p>

  <!-- 实时状态 + 今日统计 -->
  <div class="grid">
    <div class="card">
      <h3>实时状态</h3>
      <div class="realtime-box">
        <span id="status-dot" class="status-dot status-absent"></span>
        <span id="status-text">连接中...</span>
      </div>
      <div id="status-detail" style="font-size:0.85em; color:var(--muted)"></div>
    </div>
    <div class="card">
      <h3>今日学习</h3>
      <div class="stat-value" style="color:var(--green)" id="study-time">--</div>
      <div class="stat-label">学习时长</div>
    </div>
    <div class="card">
      <h3>坐姿提醒</h3>
      <div class="stat-value" style="color:var(--yellow)" id="posture-count">--</div>
      <div class="stat-label">次</div>
    </div>
    <div class="card">
      <h3>玩手机</h3>
      <div class="stat-value" style="color:var(--red)" id="phone-count">--</div>
      <div class="stat-label">次</div>
    </div>
  </div>

  <!-- AI 摘要 -->
  <div id="ai-summary-section" style="display:none">
    <div class="ai-summary" id="ai-summary"></div>
  </div>

  <!-- 周报图表 + 积分 -->
  <div class="grid" style="margin-top:24px">
    <div class="card" style="grid-column: span 2">
      <h3>本周学习时长（分钟）</h3>
      <div class="bar-chart" id="weekly-chart"></div>
    </div>
    <div class="card">
      <h3>积分 & 徽章</h3>
      <div class="points-total" id="points-total">--</div>
      <div class="stat-label">总积分</div>
      <div style="margin-top:8px; font-size:0.9em; color:var(--muted)">
        <span class="streak-fire" id="streak-icon"></span>
        <span id="streak-text"></span>
      </div>
      <div id="badges" style="margin-top:12px"></div>
    </div>
  </div>

  <!-- 作业分析 -->
  <h2 class="section-title">最近作业分析</h2>
  <div class="card">
    <ul class="homework-list" id="homework-list">
      <li class="loading">加载中...</li>
    </ul>
  </div>
</div>

<script>
const DEVICE_ID = 'mac-dev-001';
const BASE_URL = '';
const DAYS = ['日', '一', '二', '三', '四', '五', '六'];

async function fetchJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(resp.statusText);
  return resp.json();
}

function formatMinutes(m) {
  if (m >= 60) return Math.floor(m/60) + 'h' + (m%60 > 0 ? m%60 + 'm' : '');
  return m + 'm';
}

// -- 日报 --
async function loadDaily() {
  const today = new Date().toISOString().slice(0, 10);
  try {
    const data = await fetchJSON(`${BASE_URL}/api/v1/report/daily/${today}?device_id=${DEVICE_ID}`);
    const h = Math.floor(data.study_minutes / 60);
    const m = data.study_minutes % 60;
    document.getElementById('study-time').textContent = h > 0 ? `${h}h${m}m` : `${m}m`;
    document.getElementById('posture-count').textContent = data.posture_bad_count;
    document.getElementById('phone-count').textContent = data.phone_count;
    if (data.ai_summary) {
      document.getElementById('ai-summary').textContent = data.ai_summary;
      document.getElementById('ai-summary-section').style.display = 'block';
    }
  } catch(e) {
    console.error('daily load failed', e);
  }
}

// -- 周报图表 --
async function loadWeekly() {
  try {
    const data = await fetchJSON(`${BASE_URL}/api/v1/report/weekly?device_id=${DEVICE_ID}`);
    const chart = document.getElementById('weekly-chart');
    const maxMin = Math.max(...data.days.map(d => d.study_minutes), 30);
    chart.innerHTML = data.days.map(d => {
      const date = new Date(d.date);
      const dayName = DAYS[date.getDay()];
      const pct = Math.max(2, (d.study_minutes / maxMin) * 140);
      const color = d.study_minutes > 0 ? 'var(--primary-light)' : 'var(--card2)';
      return `<div class="bar-group">
        <span class="bar-value">${d.study_minutes > 0 ? d.study_minutes : ''}</span>
        <div class="bar" style="height:${pct}px; background:${color}"></div>
        <span class="bar-label">${dayName}</span>
      </div>`;
    }).join('');
  } catch(e) {
    console.error('weekly load failed', e);
  }
}

// -- 积分 --
async function loadPoints() {
  try {
    const data = await fetchJSON(`${BASE_URL}/api/v1/points/summary?device_id=${DEVICE_ID}`);
    document.getElementById('points-total').textContent = data.total_points;
    if (data.streak > 0) {
      document.getElementById('streak-icon').textContent = '🔥';
      document.getElementById('streak-text').textContent = `连续 ${data.streak} 天`;
    }
    const badgesEl = document.getElementById('badges');
    badgesEl.innerHTML = (data.badges || []).map(b =>
      `<span class="badge"><span class="badge-icon">${b.icon}</span>${b.name}</span>`
    ).join('');
  } catch(e) {
    console.error('points load failed', e);
  }
}

// -- 作业 --
async function loadHomework() {
  try {
    const data = await fetchJSON(`${BASE_URL}/api/v1/homework/recent?device_id=${DEVICE_ID}&limit=5`);
    const list = document.getElementById('homework-list');
    if (data.length === 0) {
      list.innerHTML = '<li style="color:var(--muted)">暂无作业记录</li>';
      return;
    }
    list.innerHTML = data.map(h => {
      const time = new Date(h.created_at).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
      const score = h.score_estimate != null ? `<span class="homework-score">${h.score_estimate}分</span>` : '';
      return `<li class="homework-item">
        <div>
          <span class="homework-subject">${h.subject}</span>
          <span class="homework-time" style="margin-left:12px">${time}</span>
        </div>
        <div>${score}<span style="font-size:0.8em;color:var(--muted);margin-left:8px">${h.summary || ''}</span></div>
      </li>`;
    }).join('');
  } catch(e) {
    console.error('homework load failed', e);
  }
}

// -- WebSocket 实时状态 --
const STATUS_MAP = {
  studying:   { text: '学习中（专注）', cls: 'status-studying' },
  warning:    { text: '坐姿需注意', cls: 'status-warning' },
  distracted: { text: '分心了', cls: 'status-distracted' },
  absent:     { text: '未检测到人', cls: 'status-absent' },
};

function connectWS() {
  const wsUrl = `ws://${location.host}/api/v1/realtime/${DEVICE_ID}`;
  const ws = new WebSocket(wsUrl);
  const wsStatus = document.getElementById('ws-status');

  ws.onopen = () => {
    wsStatus.textContent = 'live';
    wsStatus.className = 'ws-status ws-connected';
  };
  ws.onclose = () => {
    wsStatus.textContent = 'disconnected';
    wsStatus.className = 'ws-status ws-disconnected';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      updateStatus(data.state);
    } catch(err) {}
  };

  // keepalive
  setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 30000);
}

function updateStatus(state) {
  const info = STATUS_MAP[state] || STATUS_MAP.absent;
  const dot = document.getElementById('status-dot');
  dot.className = `status-dot ${info.cls}`;
  document.getElementById('status-text').textContent = info.text;
}

// -- 定时刷新 --
function refreshAll() {
  loadDaily();
  loadWeekly();
  loadPoints();
  loadHomework();
}

// 初始化
refreshAll();
connectWS();
setInterval(refreshAll, 15000);
</script>
</body>
</html>
